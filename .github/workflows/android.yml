# İndirici Android uygulaması (APK): android/ değişince derlenir ve assets/indirici.apk olarak
# depoya konur. Uygulama Ayarlar › Android uygulamasını indir ile bu dosyayı kendi adresinden verir.
name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK'yı derle
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK'yı depoya koy
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk assets/indirici.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/indirici.apk
          git commit -m "Android APK güncellendi (derleme ${GITHUB_RUN_NUMBER})" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

      - uses: actions/upload-artifact@v4
        with:
          name: indirici-apk
          path: assets/indirici.apk
