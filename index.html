<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>İndirici — video, yayın ve resim indirici</title>
    <meta name="description" content="Bağlantının ardındaki videoyu, HLS yayınını ve resimleri bulup indirin; canlı yayınları süre sınırıyla kaydedin.">
    <meta name="theme-color" content="#121110">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="İndirici">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        // Tema boyanmadan önce uygulansın (açık temada koyu yanıp sönme olmasın).
        try {
            const theme = JSON.parse(localStorage.getItem('indirici.prefs') || '{}').theme;
            if (theme === 'light') document.documentElement.dataset.theme = 'light';
        } catch (_) { /* depolama kapalı */ }
    </script>
</head>
<body data-view="detect">
    <div class="app">
        <!-- Masaüstü: sol kenar çubuğu -->
        <nav class="sidebar" aria-label="Bölümler">
            <div class="brand"><img src="assets/icons/icon.svg" alt="">İndirici</div>
            <button class="nav-item" data-view="detect">Algıla</button>
            <button class="nav-item" data-view="images">Resimler</button>
            <button class="nav-item" data-view="downloads">İndirmeler<span class="badge hidden" data-count></span></button>
            <button class="nav-item" data-view="settings">Ayarlar</button>
            <button class="server-card" id="sideServer" data-view="settings">
                <span class="server-card-title"><span class="dot"></span>Kendi sunucum</span>
                <span class="server-card-sub">ayarlı değil</span>
            </button>
            <button class="theme-btn-side" data-theme-toggle></button>
        </nav>

        <main class="main">
            <!-- ============ ALGILA ============ -->
            <section class="view" id="view-detect">
                <div class="view-head">
                    <span class="view-title">Algıla</span>
                    <button class="icon-btn theme-btn-head" data-theme-toggle aria-label="Temayı değiştir"></button>
                </div>
                <div class="urlbar">
                    <input type="url" id="detectUrl" placeholder="Bağlantıyı yapıştırın (video, .m3u8, sayfa)" autocomplete="off" inputmode="url">
                    <button class="btn-ac" id="detectBtn">Algıla</button>
                </div>
                <div id="detectStatus"></div>
                <div id="detectResult"></div>
            </section>

            <!-- ============ RESİMLER ============ -->
            <section class="view" id="view-images">
                <div class="view-head">
                    <span class="view-title">Resimler</span>
                    <button class="icon-btn theme-btn-head" data-theme-toggle aria-label="Temayı değiştir"></button>
                </div>
                <div class="urlbar">
                    <input type="url" id="imgUrl" placeholder="Sayfa adresi — içindeki resimler bulunur" autocomplete="off" inputmode="url">
                    <button class="btn-ac" id="imgScanBtn">Tara</button>
                </div>
                <div id="imgStatus"></div>
                <div id="imgResult"></div>
            </section>

            <!-- ============ İNDİRMELER ============ -->
            <section class="view" id="view-downloads">
                <div class="view-head">
                    <span class="view-title">İndirmeler</span>
                    <button class="pill float-only" data-float-toggle>Üstte göster</button>
                </div>
                <div id="downloadsView"></div>
            </section>

            <!-- ============ AYARLAR ============ -->
            <section class="view" id="view-settings">
                <div class="view-head">
                    <span class="view-title">Ayarlar</span>
                </div>
                <div id="settingsView"></div>
            </section>
        </main>

        <!-- Masaüstü (geniş ekran): sağda indirmeler sütunu -->
        <aside class="aside" id="downloadsAside"></aside>
    </div>

    <!-- Telefonda: sekme çubuğunun üstünde süren indirmeler şeridi -->
    <button class="strip hidden" id="dlStrip" data-view="downloads"></button>

    <nav class="tabbar" aria-label="Bölümler">
        <button class="tab" data-view="detect">Algıla</button>
        <button class="tab" data-view="images">Resimler</button>
        <button class="tab" data-view="downloads"><span>İndirmeler<span data-count-inline></span></span></button>
        <button class="tab" data-view="settings">Ayarlar</button>
    </nav>

    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
