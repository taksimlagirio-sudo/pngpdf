[build]
  publish = "."
  command = ""

# Bilinmeyen adresler için "ana sayfayı göster" yönlendirmesi bilerek YOK: uygulama tek sayfa
# ve #sekme ile çalışıyor; o kural silinmiş/eski adreslere (ör. /api/proxy) 404 yerine uygulamanın
# kendi sayfasını döndürüp Algıla'yı yanıltıyordu.

# Service worker her zaman taze alınmalı, yoksa güncellemeler kullanıcıya ulaşmaz.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
