[build]
  publish = "."
  command = ""

# Bilinmeyen adresler için "ana sayfayı göster" yönlendirmesi bilerek YOK: uygulama tek sayfa
# ve #sekme ile çalışıyor; o kural silinmiş/eski adreslere (ör. /api/proxy) 404 yerine uygulamanın
# kendi sayfasını döndürüp Algıla'yı yanıltıyordu.

# Service worker her zaman taze alınmalı, yoksa güncellemeler kullanıcıya ulaşmaz.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Her açılışta sunucuya "değişti mi?" diye sorulsun (ETag ile ucuz). Uzun max-age, telefonun
    # yeni sayfayla birlikte eski JS'i günlerce kullanmasına ve düğmelerin çalışmamasına yol açtı.
    Cache-Control = "public, max-age=0, must-revalidate"

# Tarayıcı modülleri (.mjs) doğru türle sunulsun; aksi halde modül olarak yüklenmez.
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# Paylaşım hedefi POST ile gelir; service worker yoksa Netlify işlevi karşılar.
[[redirects]]
  from = "/paylas"
  to = "/.netlify/functions/paylas"
  status = 200
  force = true
